<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase I template builder | Terraphase</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1d3342;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:35px auto;padding:0 20px}.panel{background:#fff;border:1px solid #dce4e8;border-radius:12px;box-shadow:0 6px 24px #193c4b10;padding:32px}.brand{display:flex;align-items:center;min-height:58px;margin-bottom:16px}.brand img{max-width:270px;max-height:76px;object-fit:contain}.brand-fallback{font-size:26px;font-weight:700;color:#247d80;letter-spacing:.2px}h1{font-size:29px;margin:4px 0 10px}h2{font-size:18px;margin:28px 0 16px;border-bottom:1px solid #dfe7e9;padding-bottom:10px}p.note{font-size:14px;color:#61717b;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px}.wide{grid-column:1/-1}label,.legend{font-weight:600;font-size:14px}input[type=text],input[type=date]{padding:12px;border:1px solid #b9cbd2;border-radius:7px;font:inherit;width:100%;background:#fff}input:focus{outline:2px solid #247d80;outline-offset:1px}.date-row{display:flex;gap:8px}.date-row input{flex:1}.secondary{border:1px solid #247d80;color:#16666a;background:white;border-radius:7px;padding:0 16px;font-weight:600;cursor:pointer}fieldset{border:0;padding:0;margin:0}.choices{display:flex;gap:24px;margin-top:12px}.choices label{font-weight:400}.actions{border-top:1px solid #e1e7ea;margin-top:30px;padding-top:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.primary{background:#16787d;color:#fff;border:0;border-radius:8px;padding:14px 25px;font:inherit;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}#status{font-size:14px;color:#52656e}#status.error{color:#b12727}@media(max-width:600px){.panel{padding:22px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.date-row{flex-wrap:wrap}.date-row .secondary{padding:12px}}
</style>
</head>
<body><main class="wrap"><section class="panel">
<div class="brand"><img src="logo.png" alt="Terraphase Engineering logo"><span id="brandFallback" class="brand-fallback" hidden>Terraphase Engineering</span></div>
<h1>Phase I template builder</h1><p class="note">Enter project details to generate a completed Word document from the template stored in this repository.</p>
<form id="builder">
<h2>Project information</h2><div class="grid">
<div class="field wide"><label for="siteName">Site Name</label><input id="siteName" type="text" required></div>
<div class="field wide"><label for="siteAddress">Site Address</label><input id="siteAddress" type="text" required></div>
<div class="field"><label for="siteCity">Site City</label><input id="siteCity" type="text" required></div>
<div class="field"><label for="siteCounty">Site County</label><input id="siteCounty" type="text" required></div>
<div class="field"><label for="siteState">Site State</label><input id="siteState" type="text" required></div>
<div class="field"><label for="projectNumber">Project Number</label><input id="projectNumber" type="text" placeholder="0000.000.000" required></div>
<div class="field wide"><label for="clientName">Client Name</label><input id="clientName" type="text" required></div>
<div class="field wide"><label for="clientAddress">Client Address</label><input id="clientAddress" type="text" required></div>
<div class="field wide"><label for="clientCityStateZip">Client City, State and ZIP</label><input id="clientCityStateZip" type="text" required></div>
<div class="field wide"><label for="reportDate">Report Date</label><div class="date-row"><input id="reportDate" type="date" required><button type="button" class="secondary" id="today">Use today's date</button></div></div>
<div class="field wide"><fieldset><legend class="legend">Attorney Work Product?</legend><div class="choices"><label><input type="radio" name="attorney" value="yes"> Yes</label><label><input type="radio" name="attorney" value="no" checked> No</label></div></fieldset></div>
</div>
<div class="actions"><button class="primary" id="submit" type="submit">Complete and Save</button><span id="status" role="status" aria-live="polite"></span></div>
</form></section></main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const status=(message,error=false)=>{$('status').textContent=message;$('status').classList.toggle('error',error)};
function setToday(){const now=new Date();const local=new Date(now.getTime()-now.getTimezoneOffset()*60000);$('reportDate').value=local.toISOString().slice(0,10)}
$('today').addEventListener('click',setToday);setToday();
$('brandFallback').hidden=false;
const logo=document.querySelector('.brand img');
logo.addEventListener('load',()=>{$('brandFallback').hidden=true});
logo.addEventListener('error',()=>{logo.hidden=true});
function formattedDate(iso){const [year,month,day]=iso.split('-').map(Number);return new Date(year,month-1,day).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
function replacementMap(){const v=id=>$(id).value.trim();return new Map([
['[Site Name]',v('siteName')],
['[Site Address, City, County, State]',[v('siteAddress'),v('siteCity'),v('siteCounty')+' County',v('siteState')].filter(Boolean).join(', ')],
['[Client Name]',v('clientName')],
['[CLIENT Address]',v('clientAddress')],
['[Client City State Zip]',v('clientCityStateZip')],
['[XXXX.XXX.XXX]',v('projectNumber')],
['[Date]',formattedDate(v('reportDate'))],
['[Privileged and Confidential ǀ Attorney-Client Work Product]',document.querySelector('input[name=attorney]:checked').value==='yes'?'Privileged and Confidential ǀ Attorney-Client Work Product':'']
])}
// Replace placeholder text across Word XML text runs while preserving the surrounding runs,
// paragraph styles, tables, headers, footers, and other Word document structure.
function replaceInWordXml(xml,replacements,counts){
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 if(doc.querySelector('parsererror'))throw new Error('Could not parse Word document XML.');
 const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const paragraphs=Array.from(doc.getElementsByTagNameNS(W,'p'));
 for(const p of paragraphs){
  // Ignore nested paragraph content; each w:p is processed independently.
  const texts=Array.from(p.getElementsByTagNameNS(W,'t')).filter(t=>{let parent=t.parentNode;while(parent&&parent!==p){if(parent.localName==='p')return false;parent=parent.parentNode}return parent===p});
  if(!texts.length)continue;
  for(const [token,replacement] of replacements){
   let joined=texts.map(t=>t.textContent||'').join('');let pos=joined.indexOf(token);
   while(pos!==-1){
    const end=pos+token.length;let offset=0;
    for(const node of texts){
     const original=node.textContent||'';const start=offset;const finish=start+original.length;offset=finish;
     if(finish<=pos||start>=end)continue;
     const from=Math.max(0,pos-start);const to=Math.min(original.length,end-start);
     node.textContent=original.slice(0,from)+(start<=pos&&pos<finish?replacement:'')+original.slice(to);
     if(node.textContent.startsWith(' ')||node.textContent.endsWith(' '))node.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
    }
    counts.set(token,(counts.get(token)||0)+1);
    joined=texts.map(t=>t.textContent||'').join('');pos=joined.indexOf(token,pos+replacement.length);
   }
  }
 }
 return new XMLSerializer().serializeToString(doc);
}
async function saveDocument(blob,name){
 if(window.showSaveFilePicker){
  try{const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Microsoft Word Document',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx']}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();return true}
  catch(e){if(e.name==='AbortError')return false;status('Using browser download instead of a save dialog.')}
 }
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return true;
}
$('builder').addEventListener('submit',async e=>{
 e.preventDefault();const button=$('submit');button.disabled=true;status('Loading template.zip…');
 try{
  if(typeof JSZip==='undefined')throw new Error('ZIP library did not load. Check your internet connection.');
  const response=await fetch('./template.zip',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load template.zip (HTTP '+response.status+'). Place it beside index.html in your repository.');
  const outer=await JSZip.loadAsync(await response.arrayBuffer());
  const candidates=Object.values(outer.files).filter(f=>!f.dir&&f.name.toLowerCase().endsWith('.docx')&&!f.name.split('/').some(s=>s.startsWith('__MACOSX')||s.startsWith('._')));
  if(candidates.length!==1)throw new Error('Expected exactly one .docx file inside template.zip; found '+candidates.length+'.');
  status('Populating Word template…');
  const inner=await JSZip.loadAsync(await candidates[0].async('arraybuffer'));
  const replacements=replacementMap();const counts=new Map();
  const targets=Object.keys(inner.files).filter(name=>/^word\/(document|header\d+|footer\d+|footnotes|endnotes)\.xml$/.test(name));
  if(!targets.includes('word/document.xml'))throw new Error('The ZIP does not contain a valid Word document.');
  for(const name of targets){const original=await inner.file(name).async('string');inner.file(name,replaceInWordXml(original,replacements,counts))}
  const missing=Array.from(replacements.keys()).filter(k=>!counts.has(k));
  if(missing.length)throw new Error('These exact placeholders were not found in the Word template: '+missing.join(', ')+'. No document was saved.');
  const blob=await inner.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
  const safe=($('projectNumber').value.trim()||'project').replace(/[^a-zA-Z0-9_-]/g,'_');
  status('Choose where to save your completed report…');
  const saved=await saveDocument(blob,'Phase_I_'+safe+'.docx');status(saved?'Word document generated successfully.':'Save canceled.');
 }catch(err){status(err.message||'An unexpected error occurred.',true)}finally{button.disabled=false}
});
</script></body></html>
